<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darshan Jadhav</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Yellowtail&display=swap">
<style>
:root{box-sizing:border-box;--bg:#000;--fg:#f4f4f2;--mute:#808080;--line:#262626;--acc:#ff7fae;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#000;color:var(--fg);font-family:"Sora",system-ui,sans-serif;font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:56px 20px 80px;text-align:center}
.ph{width:132px;height:132px;border-radius:50%;object-fit:cover;padding:4px;border:2px solid var(--acc);display:block;margin:0 auto 22px}
h1{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0 0 6px}
.sub{margin:0 0 14px;font-size:1.05rem;font-weight:500;color:var(--fg);opacity:.75}
.bio{color:var(--mute);margin:0 auto 32px;max-width:22em}
.skills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 6px;margin:-14px auto 32px;max-width:24em}
.skills .br{flex-basis:100%;height:0}
.skills span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--fg);opacity:.85}
.bio a{color:var(--fg);text-decoration:underline;text-decoration-color:#4a4a4a;text-decoration-thickness:1px;text-underline-offset:5px;transition:text-decoration-color .2s,color .2s}
.bio a:hover,.bio a:focus-visible{text-decoration-color:var(--acc);color:#fff}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.soc a,.row{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;transition:border-color .2s,background .2s}
.soc a{flex-direction:column;align-items:flex-start;gap:18px;padding:20px}
.soc svg{width:30px;height:30px}
.soc b,.row b{font-weight:600;display:block}
.soc small,.row small{display:block;color:var(--mute);font-size:.85rem}
.works{grid-column:1/-1;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left}
.wh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.wh svg{width:30px;height:30px}
.wh b,.wk b{font-weight:600;display:block}
.wh small,.wk small{display:block;color:var(--mute);font-size:.85rem}
.wk+.wk{margin-top:10px}
.wk{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .2s,background .2s}
.wk span{flex:1}
.wk svg{width:52px;height:52px;flex:none}
.wk img{width:52px;height:52px;flex:none;border-radius:23%;display:block}
.wk i{font-style:normal;color:var(--mute)}
a,.wk,.row,.soc a{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
a:focus:not(:focus-visible){outline:none}
.wk,.row{user-select:none;-webkit-user-select:none}
.wk:active,.row:active{background:#0d0d0d;border-color:var(--acc)}
.note{margin:12px 2px 0;font-size:.85rem;color:var(--mute)}
.wk:hover,.wk:focus-visible{border-color:var(--acc);background:#0d0d0d}
.links{display:grid;gap:12px}
.row span:first-child{flex:1}
.row i{font-style:normal;color:var(--mute)}
.soc a:hover,.soc a:focus-visible,.row:hover,.row:focus-visible{border-color:var(--acc);background:#0d0d0d}
a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.num{display:flex;justify-content:center;gap:28px;margin:0 0 32px}
.num b{display:block;font-size:1.3rem;font-weight:700}
.num span{font-size:.8rem;color:var(--mute)}
foot{display:block;margin-top:36px;color:var(--mute);font-size:.85rem}
foot a{color:var(--fg)}

.cat{position:fixed;left:0;top:0;width:80px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab;z-index:5;will-change:transform}
.cat svg{display:block;width:100%;height:auto;shape-rendering:crispEdges;overflow:visible}
.cat .body{transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
.cat.drag{cursor:grabbing}
.cat.drag .body{animation:none;transform:scale(1.08,.94) rotate(-4deg)}
.cat.hop .body{animation:hop .55s ease-out}
.cat .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.8s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
.cat.drag .tail{animation:none}
.cat .e2,.cat .e3{display:none}
.cat.watch .e1{display:none}.cat.watch .e3{display:inline}
.cat .arm{transform-box:fill-box;transform-origin:50% 0%;transform:rotate(var(--a,0deg));transition:transform .16s ease-out}
.cat .armL{--k:1}.cat .armR{--k:-1}
.cat.reach .arm{animation:swipe .8s ease-in-out infinite}
.cat.reach .armR{animation-delay:-.4s}
.cat.swat .arm{animation:swat .26s ease-in-out 4}
.cat.happy .armL{transform:rotate(155deg);animation:none}
.cat.happy .armR{transform:rotate(-155deg);animation:none}
.cat.drag .armL{transform:rotate(40deg);animation:none}
.cat.drag .armR{transform:rotate(-40deg);animation:none}
@keyframes swipe{0%,100%{transform:rotate(calc(var(--a,0deg) - 10deg * var(--k)))}50%{transform:rotate(calc(var(--a,0deg) + 14deg * var(--k)))}}
@keyframes swat{0%,100%{transform:rotate(calc(var(--a,0deg) - 14deg * var(--k)))}50%{transform:rotate(calc(var(--a,0deg) + 28deg * var(--k)))}}
@media (prefers-reduced-motion:reduce){.cat.reach .arm,.cat.swat .arm{animation:none}}

.bf{position:fixed;left:0;top:0;width:33px;height:24px;pointer-events:none;z-index:6;will-change:transform}
.bf svg{position:absolute;inset:0;width:100%;height:100%;shape-rendering:crispEdges}
.bf .w1{animation:fa .24s step-end infinite}
.bf .w2{animation:fb .24s step-end infinite}
@keyframes fa{0%{visibility:visible}50%{visibility:hidden}}
@keyframes fb{0%{visibility:hidden}50%{visibility:visible}}
@media (prefers-reduced-motion:reduce){.bf .w1,.bf .w2{animation:none}.bf .w2{visibility:hidden}}
.cat.happy .e1{display:none}.cat.happy .e2{display:inline}.cat.happy .e3{display:none}
.cat.drag .e1,.cat.drag .e2{display:none}.cat.drag .e3{display:inline}
.cat .heart{position:absolute;left:58%;top:-10px;width:28px;height:24px;opacity:0;pointer-events:none}
.cat .heart.go{animation:rise 1.2s ease-out forwards}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.95)}}
@keyframes hop{0%{transform:scale(1)}30%{transform:translateY(-16px) scale(.95,1.07)}62%{transform:scale(1.07,.9)}100%{transform:scale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.cat .body,.cat.hop .body,.cat .tail{animation:none}.cat .heart.go{animation-duration:.01s}}.cat{contain:layout style;backface-visibility:hidden}.bf{backface-visibility:hidden}
html{background:#000;overscroll-behavior:none}
a,.soc a,.row,.wk{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:border-color .2s,background .2s,transform .12s ease-out,opacity .12s}
a:active,.row:active,.wk:active,.soc a:active{transform:scale(.97);opacity:.85;background:#0d0d0d;border-color:var(--acc)}
.bio a,foot a{user-select:text;-webkit-user-select:text}
@media (prefers-reduced-motion:reduce){a:active,.row:active,.wk:active,.soc a:active{transform:none}}


.pic{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.92);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pic.on{opacity:1;visibility:visible;transition:opacity .25s ease}
.pic img{display:block;max-width:100%;max-height:100%;border-radius:18px;border:1px solid var(--line);transform:scale(.96);transition:transform .25s ease}
.pic.on img{transform:scale(1)}
@media (prefers-reduced-motion:reduce){.pic,.pic img{transition:none}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{position:relative}
.wt{position:absolute;left:calc(50% + 70px);top:46px;width:100px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;z-index:2;transform:rotate(6deg)}
.wt img{display:block;width:100%;height:auto;pointer-events:none;transform-origin:20% 90%;animation:wfloat 3s ease-in-out infinite}
.wt.pop img{animation:wpop .7s ease-out}
.wt:active img{transform:scale(.88)}
@keyframes wfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes wpop{0%{transform:scale(1)}15%{transform:scale(1.25) rotate(-8deg)}35%{transform:scale(.92) rotate(7deg)}55%{transform:scale(1.1) rotate(-5deg)}75%{transform:scale(.98) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.wt img,.wt.pop img{animation:none}}
</style></head><body>
