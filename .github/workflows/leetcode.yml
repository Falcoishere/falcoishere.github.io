
name: Update LeetCode Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch LeetCode calendar
        run: |
          node <<'NODE'
          const fs = require('fs');

          async function main() {
            const username = 'falcoisvirgin';
            const year = new Date().getUTCFullYear();

            const query = `
              query userProfileCalendar($username: String!, $year: Int) {
                matchedUser(username: $username) {
                  userCalendar(year: $year) {
                    submissionCalendar
                  }
                }
              }
            `;

            const response = await fetch('https://leetcode.com/graphql/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Referer': 'https://leetcode.com'
              },
              body: JSON.stringify({
                query,
                variables: { username, year }
              })
            });

            if (!response.ok) {
              throw new Error('LeetCode request failed: ' + response.status);
            }

            const result = await response.json();
            const raw = result?.data?.matchedUser?.userCalendar?.submissionCalendar;

            if (!raw) {
              throw new Error('No LeetCode calendar found for ' + username);
            }

            const calendar = JSON.parse(raw);

            fs.writeFileSync(
              'leetcode.json',
              JSON.stringify({
                username,
                year,
                submissionCalendar: calendar,
                updatedAt: new Date().toISOString()
              }, null, 2) + '\n'
            );

            console.log('LeetCode calendar updated successfully.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leetcode.json
          git diff --cached --quiet || git commit -m "Update LeetCode calendar"
          git push
          
